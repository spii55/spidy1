<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
      -webkit-user-select: none;
    }
    #indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      color: #999;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 10;
    }
    #secretModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #d4d4d4;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 16px;
      z-index: 100;
      user-select: text;
      -webkit-user-select: text;
    }
    #secretModal textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: none;
    }
    #secretModal textarea:focus {
      border-color: #555;
    }
    #btnRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      min-height: 32px;
    }
    #statusLine {
      font-size: 12px;
      color: #888;
      display: none;
    }
    #copyFixBtn {
      display: none;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      background: #24292f;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: auto;
      transition: background 0.2s;
    }
    #copyFixBtn:hover {
      background: #000000;
    }
    #closeBtn {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      font-size: 18px;
      color: #999;
      cursor: pointer;
    }
    #closeBtn:hover {
      color: #000;
    }
  </style>
</head>
