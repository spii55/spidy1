<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
</head>
<body style="background: white; margin: 0; padding: 0;">

  <button id="copyBtn" onclick="copyCode()" style="position: fixed; top: 15px; right: 15px; font-size: 16px; padding: 10px 20px; cursor: pointer;">Copy Code</button>

  <script>
    const matlabCode = `clc;
clear;
close all;

%% EXPERIMENT 1 - QUESTION 1

G1 = tf([2 5], [6 3 7]);
G2 = tf([5 35], [7 2]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - QUESTION 2

G1 = tf([6 5], [2 5 11]);
G2 = tf([5 1 4], [3 11 8]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - QUESTION 3

G1 = tf([1], [1 4 5]);
G2 = tf([2 7], [1 6 8]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - QUESTION 4

G1 = tf([-3], [1 -1 -1]);
G2 = tf([2 3], [1 6 -7]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - STATE SPACE MODEL

G1 = tf([1], [1 7]);
G2 = tf([1], [1 6 5]);
G3 = tf([1], [1 8]);
G4 = tf([1], [1 0]);
G5 = tf([7], [1 3]);
G6 = tf([1], [1 7 5]);
G7 = tf([5], [1 5]);
G8 = tf([1], [1 9]);
G9 = tf([1], [1]);

T1 = append(G1,G2,G3,G4,G5,G6,G7,G8,G9);

Q = [1 -2 -5 9
     2 1 8 0
     3 1 8 0
     4 1 8 0
     5 3 4 -6
     6 7 0 0
     7 3 4 -6
     8 7 0 0];

inputs = 9;
outputs = 7;

T5 = connect(T1,Q,inputs,outputs);
T = tf(T5)


%% EXPERIMENT 2 - FIRST ORDER TIME RESPONSE

k = 1;
tua = 0.5;
t1 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t1);
figure;
subplot(4,1,1);
plot(t1,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');

k = 1;
tua = 2;
t2 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t2);
subplot(4,1,2);
plot(t2,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');

k = 1;
tua = 5;
t3 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t3);
subplot(4,1,3);
plot(t3,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');

k = 1;
tua = 10;
t4 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t4);
subplot(4,1,4);
plot(t4,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');


%% EXPERIMENT 4 - TIME RESPONSE OF 2ND ORDER

wn = 5;
t = 0:0.01:5;
t4 = 0:0.01:20;

G1 = tf(wn^2, [1 2*0*wn wn^2]);
[y1, t1] = step(G1, t);
figure;
subplot(4,1,1);
plot(t1, y1, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 0)');
grid on;

G2 = tf(wn^2, [1 2*0.2*wn wn^2]);
[y2, t2] = step(G2, t);
subplot(4,1,2);
plot(t2, y2, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 0.2)');
grid on;

G3 = tf(wn^2, [1 2*1*wn wn^2]);
[y3, t3] = step(G3, t);
subplot(4,1,3);
plot(t3, y3, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 1)');
grid on;

G4 = tf(wn^2, [1 2*10*wn wn^2]);
[y4, t4] = step(G4, t4);
subplot(4,1,4);
plot(t4, y4, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 10)');
grid on;


%% EXPERIMENT 6 - ROOT LOCUS

s = tf('s');

% System 1
G1 = 1/(s*(s+1)*(s+4));
disp('System 1:');
disp(G1);
figure;
rlocus(G1);
title('Root Locus of System 1');
grid on;

% System 2
G2 = (s+3)/(s*(s+1)*(s+2)*(s+4));
disp('System 2:');
disp(G2);
figure;
rlocus(G2);
title('Root Locus of System 2');
grid on;

% System 3
G3 = 1/(s*(s+1)*(s*s+4*s+8));
disp('System 3:');
disp(G3);
figure;
rlocus(G3);
title('Root Locus of System 3');
grid on;

% System 4
G4 = (s+2)/(s*(s+4)*(s*s+2*s+2));
disp('System 4:');
disp(G4);
figure;
rlocus(G4);
title('Root Locus of System 4');
grid on;


%% EXPERIMENT 7 - BODE PLOT

s = tf('s');

G = [100*(s+3)/(s*(s+1)*(s+5)), ...
     80/(s*(s+2)*(s+20)), ...
     1/(s*(s+1)*(s+3)), ...
     100*(s+4)/(s*(s+0.5)*(s+10))];

disp('Systems:');
disp(G);

figure;
bode(G);
title('Bode Plot of Systems');
grid on;

for k = 1:numel(G)
    [Gm, Pm, Wpc, Wgc] = margin(G(k));
    Gm_dB = 20*log10(Gm);

    fprintf('\\nSystem %d:\\n', k);
    fprintf('Gain Margin: %g dB at wpc = %g rad/s\\n', Gm_dB, Wpc);
    fprintf('Phase Margin: %g deg at wgc = %g rad/s\\n', Pm, Wgc);

    if Gm > 1 && Pm > 0
        disp('System is relatively stable.');
    elseif Gm == 1 || Pm == 0
        disp('System is marginally stable.');
    else
        disp('System is unstable.');
    end
end


%% EXPERIMENT 8 - TRANSFER FUNCTION TO STATE SPACE

num = [0 3 2];
den = [1 4 4];

fprintf('Transfer Function Considered: G(s) = (3s + 2) / (s^2 + 4s + 4)\\n');

[A, B, C, D] = tf2ss(num, den);

fprintf('\\nState-Space Matrices (Controllable Canonical Form):\\n\\n');

disp('A Matrix:');
disp(A);

disp('B Matrix (Input Matrix):');
disp(B);

disp('C Matrix (Output Matrix):');
disp(C);

disp('D Matrix (Feedthrough Matrix):');
disp(D);


%% EXPERIMENT 9 - CONTROLLABILITY AND OBSERVABILITY

num = [1 3];
den = [1 4 3];

fprintf('Transfer Function Considered: G(s) = (s + 3) / (s^2 + 4s + 3)\\n');

n = length(den) - 1;

fprintf('Order of the system (n) = %d\\n', n);

disp('----------------------------------------------');

% Obtain State-Space Matrices

[A, B, C, D] = tf2ss(num, den);

fprintf('State-Space Matrices (from tf2ss):\\n');

disp('A = '); disp(A);
disp('B = '); disp(B);
disp('C = '); disp(C);
disp('D = '); disp(D);

disp('----------------------------------------------');

% Check Controllability

Qc = ctrb(A, B);

rank_Qc = rank(Qc);

fprintf('Controllability Matrix (Qc):\\n');

disp(Qc);

fprintf('Rank of Qc = %d\\n', rank_Qc);

if rank_Qc == n
    fprintf('Result: The system is COMPLETELY CONTROLLABLE (since rank(Qc) = n).\\n');
else
    fprintf('Result: The system is NOT completely controllable (since rank(Qc) ~= n).\\n');
end

disp('----------------------------------------------');

% Check Observability

Qo = obsv(A, C);

rank_Qo = rank(Qo);

fprintf('Observability Matrix (Qo):\\n');

disp(Qo);

fprintf('Rank of Qo = %d\\n', rank_Qo);

if rank_Qo == n
    fprintf('Result: The system is COMPLETELY OBSERVABLE (since rank(Qo) = n).\\n');
else
    fprintf('Result: The system is NOT completely observable (since rank(Qo) ~= n).\\n');
end

disp('----------------------------------------------');
`;

    function copyCode() {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(matlabCode).then(() => {
          showCopied();
        }).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = matlabCode;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        showCopied();
      } catch (err) {
        alert('Failed to copy');
      }
      document.body.removeChild(ta);
    }

    function showCopied() {
      const btn = document.getElementById('copyBtn');
      btn.innerText = 'Copied!';
      setTimeout(() => { btn.innerText = 'Copy Code'; }, 1500);
    }
  </script>
</body>
</html>
