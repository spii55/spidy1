<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
      -webkit-user-select: none;
    }
    #indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      color: #999;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 10;
    }
    #secretModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #d4d4d4;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 16px;
      z-index: 100;
      user-select: text;
      -webkit-user-select: text;
    }
    #secretModal textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: none;
    }
    #secretModal textarea:focus {
      border-color: #555;
    }
    #btnRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      min-height: 32px;
    }
    #statusLine {
      font-size: 12px;
      color: #888;
      display: none;
    }
    #copyFixBtn {
      display: none;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      background: #24292f;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: auto;
      transition: background 0.2s;
    }
    #copyFixBtn:hover {
      background: #000000;
    }
    #closeBtn {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      font-size: 18px;
      color: #999;
      cursor: pointer;
    }
    #closeBtn:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <div id="indicator">&#10003;</div>

  <div id="secretModal">
    <button id="closeBtn" onclick="hideModal()">&times;</button>
    <textarea id="errInput" placeholder="xxx paste error or question here..." spellcheck="false"></textarea>
    <div id="btnRow">
      <span id="statusLine">Generating fix...</span>
      <button id="copyFixBtn" onclick="copyExtractedCode()">Copy Code</button>
    </div>
  </div>

  <script>
    const matlabCode = `clc;
clear;
close all;

%% EXPERIMENT 1 - QUESTION 1

G1 = tf([2 5], [6 3 7]);
G2 = tf([5 35], [7 2]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - QUESTION 2

G1 = tf([6 5], [2 5 11]);
G2 = tf([5 1 4], [3 11 8]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - QUESTION 3

G1 = tf([1], [1 4 5]);
G2 = tf([2 7], [1 6 8]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - QUESTION 4

G1 = tf([-3], [1 -1 -1]);
G2 = tf([2 3], [1 6 -7]);

T = G1 + G2;
[z,p,k] = zpkdata(T,'v')

[y,t] = step(T);
figure;
plot(t,y);
grid on;
xlabel('Time in sec');
ylabel('Amplitude');
title('Unit Step Response');


%% EXPERIMENT 1 - STATE SPACE MODEL

G1 = tf([1], [1 7]);
G2 = tf([1], [1 6 5]);
G3 = tf([1], [1 8]);
G4 = tf([1], [1 0]);
G5 = tf([7], [1 3]);
G6 = tf([1], [1 7 5]);
G7 = tf([5], [1 5]);
G8 = tf([1], [1 9]);
G9 = tf([1], [1]);

T1 = append(G1,G2,G3,G4,G5,G6,G7,G8,G9);

Q = [1 -2 -5 9
     2 1 8 0
     3 1 8 0
     4 1 8 0
     5 3 4 -6
     6 7 0 0
     7 3 4 -6
     8 7 0 0];

inputs = 9;
outputs = 7;

T5 = connect(T1,Q,inputs,outputs);
T = tf(T5)


%% EXPERIMENT 2 - FIRST ORDER TIME RESPONSE

k = 1;
tua = 0.5;
t1 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t1);
figure;
subplot(4,1,1);
plot(t1,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');

k = 1;
tua = 2;
t2 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t2);
subplot(4,1,2);
plot(t2,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');

k = 1;
tua = 5;
t3 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t3);
subplot(4,1,3);
plot(t3,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');

k = 1;
tua = 10;
t4 = 0:0.1:5*tua;
G1 = tf([k], [tua 1]);
[y,~] = step(G1, t4);
subplot(4,1,4);
plot(t4,y);
xlabel('Time in sec');
ylabel('Amplitude in A');
title('Time response graph');


%% EXPERIMENT 4 - TIME RESPONSE OF 2ND ORDER

wn = 5;
t = 0:0.01:5;
t4 = 0:0.01:20;

G1 = tf(wn^2, [1 2*0*wn wn^2]);
[y1, t1] = step(G1, t);
figure;
subplot(4,1,1);
plot(t1, y1, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 0)');
grid on;

G2 = tf(wn^2, [1 2*0.2*wn wn^2]);
[y2, t2] = step(G2, t);
subplot(4,1,2);
plot(t2, y2, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 0.2)');
grid on;

G3 = tf(wn^2, [1 2*1*wn wn^2]);
[y3, t3] = step(G3, t);
subplot(4,1,3);
plot(t3, y3, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 1)');
grid on;

G4 = tf(wn^2, [1 2*10*wn wn^2]);
[y4, t4] = step(G4, t4);
subplot(4,1,4);
plot(t4, y4, 'LineWidth', 1.5);
xlabel('Time (sec)');
ylabel('Amplitude');
title('Step Response (zeta = 10)');
grid on;


%% EXPERIMENT 6 - ROOT LOCUS

s = tf('s');

% System 1
G1 = 1/(s*(s+1)*(s+4));
disp('System 1:');
disp(G1);
figure;
rlocus(G1);
title('Root Locus of System 1');
grid on;

% System 2
G2 = (s+3)/(s*(s+1)*(s+2)*(s+4));
disp('System 2:');
disp(G2);
figure;
rlocus(G2);
title('Root Locus of System 2');
grid on;

% System 3
G3 = 1/(s*(s+1)*(s*s+4*s+8));
disp('System 3:');
disp(G3);
figure;
rlocus(G3);
title('Root Locus of System 3');
grid on;

% System 4
G4 = (s+2)/(s*(s+4)*(s*s+2*s+2));
disp('System 4:');
disp(G4);
figure;
rlocus(G4);
title('Root Locus of System 4');
grid on;


%% EXPERIMENT 7 - BODE PLOT

s = tf('s');

G = [100*(s+3)/(s*(s+1)*(s+5)), ...
     80/(s*(s+2)*(s+20)), ...
     1/(s*(s+1)*(s+3)), ...
     100*(s+4)/(s*(s+0.5)*(s+10))];

disp('Systems:');
disp(G);

figure;
bode(G);
title('Bode Plot of Systems');
grid on;

for k = 1:numel(G)
    [Gm, Pm, Wpc, Wgc] = margin(G(k));
    Gm_dB = 20*log10(Gm);

    fprintf('\\nSystem %d:\\n', k);
    fprintf('Gain Margin: %g dB at wpc = %g rad/s\\n', Gm_dB, Wpc);
    fprintf('Phase Margin: %g deg at wgc = %g rad/s\\n', Pm, Wgc);

    if Gm > 1 && Pm > 0
        disp('System is relatively stable.');
    elseif Gm == 1 || Pm == 0
        disp('System is marginally stable.');
    else
        disp('System is unstable.');
    end
end


%% EXPERIMENT 8 - TRANSFER FUNCTION TO STATE SPACE

num = [0 3 2];
den = [1 4 4];

fprintf('Transfer Function Considered: G(s) = (3s + 2) / (s^2 + 4s + 4)\\n');

[A, B, C, D] = tf2ss(num, den);

fprintf('\\nState-Space Matrices (Controllable Canonical Form):\\n\\n');

disp('A Matrix:');
disp(A);

disp('B Matrix (Input Matrix):');
disp(B);

disp('C Matrix (Output Matrix):');
disp(C);

disp('D Matrix (Feedthrough Matrix):');
disp(D);


%% EXPERIMENT 9 - CONTROLLABILITY AND OBSERVABILITY

num = [1 3];
den = [1 4 3];

fprintf('Transfer Function Considered: G(s) = (s + 3) / (s^2 + 4s + 3)\\n');

n = length(den) - 1;

fprintf('Order of the system (n) = %d\\n', n);

disp('----------------------------------------------');

% Obtain State-Space Matrices

[A, B, C, D] = tf2ss(num, den);

fprintf('State-Space Matrices (from tf2ss):\\n');

disp('A = '); disp(A);
disp('B = '); disp(B);
disp('C = '); disp(C);
disp('D = '); disp(D);

disp('----------------------------------------------');

% Check Controllability

Qc = ctrb(A, B);

rank_Qc = rank(Qc);

fprintf('Controllability Matrix (Qc):\\n');

disp(Qc);

fprintf('Rank of Qc = %d\\n', rank_Qc);

if rank_Qc == n
    fprintf('Result: The system is COMPLETELY CONTROLLABLE (since rank(Qc) = n).\\n');
else
    fprintf('Result: The system is NOT completely controllable (since rank(Qc) ~= n).\\n');
end

disp('----------------------------------------------');

% Check Observability

Qo = obsv(A, C);

rank_Qo = rank(Qo);

fprintf('Observability Matrix (Qo):\\n');

disp(Qo);

fprintf('Rank of Qo = %d\\n', rank_Qo);

if rank_Qo == n
    fprintf('Result: The system is COMPLETELY OBSERVABLE (since rank(Qo) = n).\\n');
else
    fprintf('Result: The system is NOT completely observable (since rank(Qo) ~= n).\\n');
end

disp('----------------------------------------------');
`;
    const API_KEY = atob("QVEuQWI4Uk42SnlQWkVDeWRpRDRWWExQbm5JeV9pZG9rUU1zcVFtNVU1a1dzQm84RmNVT0E=");
    let generatedFixCode = "";

    // --- 1. Triple click anywhere to copy whole matlab file ---
    let clickCount = 0;
    let clickTimer = null;

    document.body.addEventListener('click', function(e) {
      if (e.target.closest('#secretModal')) return;
      clickCount++;
      if (clickTimer) clearTimeout(clickTimer);
      clickTimer = setTimeout(function() {
        if (clickCount >= 3) {
          copyFullCode();
        }
        clickCount = 0;
      }, 350);
    });

    function copyFullCode() {
      copyToClipboard(matlabCode, flashCheck);
    }

    function copyToClipboard(text, onSuccess) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          if (onSuccess) onSuccess();
        }).catch(() => {
          fallbackClipboard(text, onSuccess);
        });
      } else {
        fallbackClipboard(text, onSuccess);
      }
    }

    function fallbackClipboard(text, onSuccess) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        if (onSuccess) onSuccess();
      } catch(err) {}
      document.body.removeChild(ta);
    }

    function flashCheck() {
      const el = document.getElementById('indicator');
      el.style.opacity = '1';
      setTimeout(() => { el.style.opacity = '0'; }, 500);
    }

    // --- 2. Secret Unlock Methods ---
    // Method A: Long-press / hold mouse or touch for 1.2s
    let holdTimer = null;
    document.body.addEventListener('mousedown', function(e) {
      if (e.target.closest('#secretModal')) return;
      holdTimer = setTimeout(showModal, 1200);
    });
    document.body.addEventListener('mouseup', function() { clearTimeout(holdTimer); });
    document.body.addEventListener('mouseleave', function() { clearTimeout(holdTimer); });

    document.body.addEventListener('touchstart', function(e) {
      if (e.target.closest('#secretModal')) return;
      holdTimer = setTimeout(showModal, 1200);
    }, {passive: true});
    document.body.addEventListener('touchend', function() { clearTimeout(holdTimer); });

    // Method B: Keyboard trigger - typing 'x' three times anywhere opens it
    let keyBuffer = '';
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        hideModal();
        return;
      }
      if (document.getElementById('secretModal').style.display === 'block') return;

      keyBuffer += e.key.toLowerCase();
      if (keyBuffer.length > 5) keyBuffer = keyBuffer.slice(-5);
      if (keyBuffer.endsWith('xxx')) {
        showModal();
        document.getElementById('errInput').value = 'xxx ';
      }
    });

    function showModal() {
      const modal = document.getElementById('secretModal');
      modal.style.display = 'block';
      const input = document.getElementById('errInput');
      input.focus();
    }

    function hideModal() {
      document.getElementById('secretModal').style.display = 'none';
      document.getElementById('statusLine').style.display = 'none';
      document.getElementById('copyFixBtn').style.display = 'none';
      document.getElementById('errInput').value = '';
      generatedFixCode = '';
    }

    function copyExtractedCode() {
      if (!generatedFixCode) return;
      copyToClipboard(generatedFixCode, () => {
        const btn = document.getElementById('copyFixBtn');
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = 'Copy Code'; }, 1500);
      });
    }

    // --- 3. Process Query with 'xxx' prefix condition + FULL SCRIPT CONTEXT ---
    document.getElementById('errInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = this.value.trim();

        // STRICT REQUIREMENT: Only execute if 'xxx' is written before query
        if (!text.toLowerCase().startsWith('xxx')) {
          return;
        }

        const query = text.slice(3).trim();
        if (!query) return;

        const statusEl = document.getElementById('statusLine');
        const copyBtn = document.getElementById('copyFixBtn');

        statusEl.innerText = 'Generating fix...';
        statusEl.style.display = 'inline';
        copyBtn.style.display = 'none';
        this.disabled = true;

        // Prompt includes full matlabCode context so AI knows the exact lab code
        const promptText = "You are a MATLAB lab assistant for a student in Control Systems practical lab.\n" +
          "Here is the student's complete script containing all experiments:\n\n" +
          matlabCode + "\n\n" +
          "The student encountered this error or needs this modification:\n" +
          query + "\n\n" +
          "Instructions:\n" +
          "- Using the exact code context above, output ONLY the corrected executable MATLAB code snippet to fix the issue.\n" +
          "- Do NOT include markdown code fences (no backticks).\n" +
          "- Do NOT include explanations, greetings, comments, or text.\n" +
          "- Output ONLY pure runnable MATLAB code ready to paste directly into MATLAB.";

        const payload = {
          contents: [{ parts: [{ text: promptText }] }]
        };

        fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=' + API_KEY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(r => {
          if (!r.ok) {
            return fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + API_KEY, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).then(r2 => r2.json());
          }
          return r.json();
        })
        .then(data => {
          statusEl.style.display = 'none';
          document.getElementById('errInput').disabled = false;
          try {
            let raw = data.candidates[0].content.parts[0].text;
            // Strip any markdown code blocks or backticks if returned
            raw = raw.replace(/^```[a-zA-Z]*\n?/gm, '').replace(/```\n?$/gm, '').trim();
            generatedFixCode = raw;

            // Automatically copy to clipboard immediately!
            copyToClipboard(generatedFixCode, () => {
              copyBtn.innerText = 'Copied!';
            });

            // Show discreet little copy button
            copyBtn.style.display = 'inline-block';
            setTimeout(() => { copyBtn.innerText = 'Copy Code'; }, 2500);
          } catch(err) {
            statusEl.innerText = 'Error generating code';
            statusEl.style.display = 'inline';
          }
        })
        .catch(err => {
          statusEl.innerText = 'Request failed';
          statusEl.style.display = 'inline';
          document.getElementById('errInput').disabled = false;
        });
      }
    });
  </script>
</body>
</html>
